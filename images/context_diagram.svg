<svg viewBox="0 0 980 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-title context-desc" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <title id="context-title">AICoverGen System Context Diagram</title>
  <desc id="context-desc">C4 Level 1 System Context Diagram showing users, external systems, and AICoverGen platform boundaries.</desc>

  <defs>
    <pattern id="grid-ctx" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <marker id="arr-ctx" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="980" height="440" rx="12" fill="#0b0f19"/>
  <rect width="980" height="440" rx="12" fill="url(#grid-ctx)"/>
  <rect x="1" y="1" width="978" height="438" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(40, 25)">
    <text x="0" y="15" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.05em">SYSTEM CONTEXT DIAGRAM (C4 LEVEL 1)</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11">System boundary, user personas, external dependencies, and network integrations</text>
  </g>

  <!-- Left: Users -->
  <g transform="translate(50, 100)">
    <rect width="180" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="16" fill="#0284c7"/>
    <text x="90" y="40" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">👤</text>
    <text x="90" y="70" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Local User / Creator</text>
    <text x="90" y="88" fill="#94a3b8" font-size="9" text-anchor="middle">Browser on Localhost / LAN</text>
    <text x="90" y="102" fill="#38bdf8" font-size="8" font-family="monospace" text-anchor="middle">http://127.0.0.1:7860</text>
  </g>

  <g transform="translate(50, 260)">
    <rect width="180" height="120" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="16" fill="#7e22ce"/>
    <text x="90" y="40" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">👥</text>
    <text x="90" y="70" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Remote Friend / Collaborator</text>
    <text x="90" y="88" fill="#94a3b8" font-size="9" text-anchor="middle">Mobile or External PC</text>
    <text x="90" y="102" fill="#c084fc" font-size="8" font-family="monospace" text-anchor="middle">https://*.gradio.live</text>
  </g>

  <!-- Center: System Boundary -->
  <rect x="290" y="80" width="380" height="320" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="305" y="68" width="170" height="22" rx="4" fill="#1d4ed8"/>
  <text x="390" y="83" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">SYSTEM BOUNDARY</text>

  <g transform="translate(320, 110)">
    <rect width="320" height="260" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="30" fill="#60a5fa" font-size="14" font-weight="800" text-anchor="middle">AICoverGen (Local Edition)</text>
    <text x="160" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">Neural Voice Conversion &amp; Source Separation</text>
    
    <!-- Sub-boxes inside system -->
    <rect x="20" y="65" width="280" height="45" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="160" y="85" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Gradio WebUI &amp; Carbon Audio Controller</text>
    <text x="160" y="98" fill="#64748b" font-size="8" text-anchor="middle">Interactive Sliders, Player Card, Real-time Visualizer</text>

    <rect x="20" y="120" width="280" height="50" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="160" y="140" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Core Processing Engine</text>
    <text x="160" y="153" fill="#94a3b8" font-size="8" text-anchor="middle">SongMetadata Normalizer &amp; Windows Job Process Guard</text>

    <rect x="20" y="180" width="280" height="60" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="160" y="200" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Neural Workloads (CUDA/PyTorch)</text>
    <text x="160" y="214" fill="#94a3b8" font-size="8" text-anchor="middle">MDX-Net ONNX Stems + RVC v2 Voice Transfer</text>
    <text x="160" y="226" fill="#10b981" font-size="7.5" font-family="monospace" text-anchor="middle">FP16 Half-Precision (Optimized for 4GB VRAM)</text>
  </g>

  <!-- Right: External Systems -->
  <g transform="translate(730, 85)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
    <text x="100" y="25" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">EXTERNAL MEDIA SOURCE</text>
    <text x="100" y="46" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">YouTube / YT Music</text>
    <text x="100" y="62" fill="#94a3b8" font-size="9" text-anchor="middle">Video Audio Stream &amp; Metadata</text>
    <text x="100" y="74" fill="#ef4444" font-size="8" font-family="monospace" text-anchor="middle">yt-dlp extraction</text>
  </g>

  <g transform="translate(730, 195)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/>
    <text x="100" y="25" fill="#fde047" font-size="10" font-weight="700" text-anchor="middle">MODEL REPOSITORY</text>
    <text x="100" y="46" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Hugging Face Hub</text>
    <text x="100" y="62" fill="#94a3b8" font-size="9" text-anchor="middle">RVC Checkpoint (.pth / .index)</text>
    <text x="100" y="74" fill="#facc15" font-size="8" font-family="monospace" text-anchor="middle">HTTP GET (with HF Token auth)</text>
  </g>

  <g transform="translate(730, 305)">
    <rect width="200" height="85" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="100" y="22" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">TUNNELING SERVICE</text>
    <text x="100" y="42" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Gradio Public Tunnel</text>
    <text x="100" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">Ephemeral reverse proxy tunnel</text>
    <text x="100" y="70" fill="#a855f7" font-size="8" font-family="monospace" text-anchor="middle">frpc proxy daemon</text>
  </g>

  <!-- Connectors -->
  <path d="M230 160 H320" stroke="#38bdf8" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx)"/>
  <path d="M230 320 Q270 320 270 345 H320" stroke="#a855f7" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx)"/>

  <path d="M640 160 H730" stroke="#ef4444" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx)"/>
  <path d="M640 240 H730" stroke="#eab308" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx)"/>
  <path d="M640 330 H730" stroke="#8b5cf6" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx)"/>
</svg>
