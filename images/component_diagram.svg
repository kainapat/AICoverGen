<svg viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comp-title comp-desc" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <title id="comp-title">AICoverGen Component Architecture Diagram</title>
  <desc id="comp-desc">C4 Level 2 Component diagram showing interactions between WebUI, Core Pipeline, Deep Metadata, Model Registry, and Windows Process Guard.</desc>

  <defs>
    <pattern id="grid-cmp" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <marker id="arr-blue-c" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-green-c" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="980" height="460" rx="12" fill="#0b0f19"/>
  <rect width="980" height="460" rx="12" fill="url(#grid-cmp)"/>
  <rect x="1" y="1" width="978" height="458" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(40, 25)">
    <text x="0" y="15" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.05em">COMPONENT ARCHITECTURE DIAGRAM (C4 LEVEL 2)</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11">Internal modules, seams, data flows, and hardware acceleration interfaces</text>
  </g>

  <!-- Layer 1: Presentation & Entrypoints (Top) -->
  <rect x="40" y="70" width="900" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="90" fill="#64748b" font-size="9" font-weight="700" letter-spacing="0.1em">PRESENTATION &amp; ENTRYPOINT LAYER</text>

  <g transform="translate(60, 95)">
    <rect width="260" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="130" y="22" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">webui.py</text>
    <text x="130" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Gradio 5.44 + Carbon Audio Controller</text>
  </g>

  <g transform="translate(360, 95)">
    <rect width="260" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="130" y="22" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">main.py (CLI)</text>
    <text x="130" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Command-line Argparse Interface</text>
  </g>

  <g transform="translate(660, 95)">
    <rect width="260" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="130" y="22" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">launch.py &amp; launcher_process.py</text>
    <text x="130" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Windows Job Object &amp; Kernel Guard</text>
  </g>

  <!-- Layer 2: Core Domain & Orchestration (Middle) -->
  <rect x="40" y="180" width="900" height="130" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="200" fill="#64748b" font-size="9" font-weight="700" letter-spacing="0.1em">CORE DOMAIN &amp; ORCHESTRATION LAYER (DEEP MODULES)</text>

  <g transform="translate(60, 215)">
    <rect width="260" height="80" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="24" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle">song_metadata.py</text>
    <text x="130" y="42" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">SongMetadata Normalizer</text>
    <text x="130" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">NFKC Normalizer &middot; CJK Romaji &middot; Inversion</text>
    <rect x="20" y="65" width="220" height="12" rx="2" fill="#0f172a"/>
    <text x="130" y="74" fill="#6ee7b7" font-size="7" font-family="monospace" text-anchor="middle">Seam: SongMetadata.from_input()</text>
  </g>

  <g transform="translate(360, 215)">
    <rect width="260" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="24" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">cover_pipeline.py</text>
    <text x="130" y="42" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Pipeline Orchestrator</text>
    <text x="130" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">Typed CoverJob Contract &middot; Lifecycle State</text>
    <rect x="20" y="65" width="220" height="12" rx="2" fill="#0f172a"/>
    <text x="130" y="74" fill="#7dd3fc" font-size="7" font-family="monospace" text-anchor="middle">Seam: CoverPipeline.execute(job)</text>
  </g>

  <g transform="translate(660, 215)">
    <rect width="260" height="80" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="24" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle">model_registry.py</text>
    <text x="130" y="42" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">VoiceModelRegistry</text>
    <text x="130" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">RVC Scanner &middot; In-memory FAISS &middot; Zip Unpack</text>
    <rect x="20" y="65" width="220" height="12" rx="2" fill="#0f172a"/>
    <text x="130" y="74" fill="#6ee7b7" font-size="7" font-family="monospace" text-anchor="middle">Seam: registry.get_model_paths()</text>
  </g>

  <!-- Layer 3: Audio Inference & Processing Engines (Bottom) -->
  <rect x="40" y="330" width="900" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="350" fill="#64748b" font-size="9" font-weight="700" letter-spacing="0.1em">INFERENCE &amp; AUDIO PROCESSING ENGINES</text>

  <g transform="translate(60, 365)">
    <rect width="200" height="50" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="100" y="22" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">mdx.py (MDX-Net)</text>
    <text x="100" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">ONNX Runtime &middot; Stem Separation</text>
  </g>

  <g transform="translate(285, 365)">
    <rect width="200" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="100" y="22" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">rvc.py &amp; rmvpe.py</text>
    <text x="100" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Retrieval-based Voice Conversion v2</text>
  </g>

  <g transform="translate(510, 365)">
    <rect width="200" height="50" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
    <text x="100" y="22" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">Pedalboard &amp; SoX</text>
    <text x="100" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Pitch Shifting &amp; Reverb Effects</text>
  </g>

  <g transform="translate(735, 365)">
    <rect width="185" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="92" y="22" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">pydub &amp; soundfile</text>
    <text x="92" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Stereo Mixdown &amp; MP3/WAV Export</text>
  </g>

  <!-- Connectors -->
  <path d="M190 145 V215" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arr-blue-c)"/>
  <path d="M490 145 V215" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arr-blue-c)"/>
  <path d="M790 145 V215" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arr-green-c)"/>

  <path d="M490 295 V365" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arr-blue-c)"/>
</svg>
