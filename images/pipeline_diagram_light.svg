<svg viewBox="0 0 980 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-diagram-title-light pipeline-diagram-desc-light" style="background:#f8fafc; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <title id="pipeline-diagram-title-light">AICoverGen Audio Separation &amp; Voice Conversion Pipeline (Light Mode)</title>
  <desc id="pipeline-diagram-desc-light">Complete end-to-end data flow showing stem separation, RVC voice conversion, and audio effects mixing with Fast Mode optimization in light theme.</desc>

  <defs>
    <!-- Background Grid -->
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="rgba(15, 23, 42, 0.08)"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="grad-output-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-blue-l" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald-l" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-gray-l" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber-l" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="430" rx="12" fill="#f8fafc"/>
  <rect width="980" height="430" rx="12" fill="url(#grid-light)"/>
  <rect x="1" y="1" width="978" height="428" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(40, 20)">
    <text x="0" y="15" fill="#0f172a" font-size="14" font-weight="700" letter-spacing="0.05em">AUDIO PROCESSING &amp; STEM SEPARATION PIPELINE</text>
    <text x="0" y="32" fill="#64748b" font-size="11">Data flow across UVR MDX-Net ONNX models, RVC v2 inference, and Pedalboard audio mastering</text>
  </g>

  <!-- Legend -->
  <g transform="translate(680, 22)">
    <circle cx="10" cy="10" r="5" fill="#2563eb"/>
    <text x="22" y="14" fill="#475569" font-size="10" font-weight="500">Active Stem</text>
    <circle cx="110" cy="10" r="5" fill="#059669"/>
    <text x="122" y="14" fill="#475569" font-size="10" font-weight="500">Fast Mode 2x</text>
    <circle cx="210" cy="10" r="5" fill="#d97706"/>
    <text x="222" y="14" fill="#475569" font-size="10" font-weight="500">AI Converted</text>
  </g>

  <!-- Horizontal Swimlane Guides -->
  <line x1="40" y1="65" x2="940" y2="65" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Lane Labels -->
  <text x="40" y="115" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.1em">VOCAL STEM LANE</text>
  <text x="40" y="365" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.1em">INSTRUMENTAL STEM LANE</text>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- 1. Input to MDX Voc_FT -->
  <path d="M140 195 H180" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue-l)"/>
  
  <!-- 2. MDX Voc_FT to Instrumental (Lower Branch) -->
  <path d="M255 235 V340 Q255 350 265 350 H770" stroke="#64748b" stroke-width="1.8" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-gray-l)"/>
  <text x="320" y="342" fill="#64748b" font-size="9" font-family="monospace">Instrumental (-7dB)</text>

  <!-- 3. MDX Voc_FT to Karaoke KARA_2 (Upper Branch) -->
  <path d="M330 195 H365" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue-l)"/>
  <text x="335" y="187" fill="#1d4ed8" font-size="9" font-weight="600">Vocals</text>

  <!-- 4. Karaoke to Backup Vocals (Middle-Lower Branch) -->
  <path d="M440 235 V280 Q440 290 450 290 H770" stroke="#64748b" stroke-width="1.8" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-gray-l)"/>
  <text x="480" y="283" fill="#64748b" font-size="9" font-family="monospace">Backup Vocals (-6dB)</text>

  <!-- 5. Karaoke to DeReverb (Normal Mode) / Direct to RVC (Fast Mode) -->
  <!-- Fast Mode bypass curve -->
  <path d="M515 175 C540 120 570 120 610 175" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrow-emerald-l)"/>
  <rect x="525" y="112" width="75" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="562" y="124" fill="#065f46" font-size="9" font-weight="700" text-anchor="middle">⚡ Fast Mode</text>

  <!-- Normal Mode to DeReverb -->
  <path d="M515 195 H545" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue-l)"/>
  <!-- DeReverb to RVC -->
  <path d="M605 210 H625" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue-l)"/>

  <!-- 6. RVC to Pedalboard Effects -->
  <path d="M720 195 H745" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrow-amber-l)"/>

  <!-- 7. Effects to Mixer -->
  <path d="M820 195 H855" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrow-amber-l)"/>
  <text x="825" y="187" fill="#b45309" font-size="9" font-weight="600">AI Vocals (-4dB)</text>

  <!-- 8. Mixer to Final Output -->
  <path d="M915 225 V280" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow-blue-l)"/>

  <!-- ==================== NODES / CARDS (LIGHT THEME) ==================== -->

  <!-- Node 1: Input -->
  <g transform="translate(40, 160)">
    <rect width="100" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="50" y="24" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">INPUT AUDIO</text>
    <text x="50" y="42" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">YouTube / File</text>
    <rect x="18" y="50" width="64" height="14" rx="3" fill="#f1f5f9"/>
    <text x="50" y="60" fill="#64748b" font-size="8" text-anchor="middle">44.1kHz Stereo</text>
  </g>

  <!-- Node 2: Stage 1 MDX Voc_FT -->
  <g transform="translate(180, 155)">
    <rect width="150" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="8" y="8" width="55" height="16" rx="3" fill="#eff6ff"/>
    <text x="35" y="19" fill="#1d4ed8" font-size="8" font-weight="700" text-anchor="middle">STAGE 1</text>
    <text x="135" y="20" fill="#94a3b8" font-size="9" text-anchor="end">ONNX Model</text>
    <text x="12" y="42" fill="#0f172a" font-size="12" font-weight="700">MDX-NET Voc_FT</text>
    <text x="12" y="58" fill="#475569" font-size="10">Separates Vocals vs Inst</text>
    <text x="12" y="72" fill="#2563eb" font-size="8" font-family="monospace">UVR-MDX-NET-Voc_FT</text>
  </g>

  <!-- Node 3: Stage 2 MDX KARA_2 -->
  <g transform="translate(365, 155)">
    <rect width="150" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="8" y="8" width="55" height="16" rx="3" fill="#eff6ff"/>
    <text x="35" y="19" fill="#1d4ed8" font-size="8" font-weight="700" text-anchor="middle">STAGE 2</text>
    <text x="135" y="20" fill="#94a3b8" font-size="9" text-anchor="end">ONNX Model</text>
    <text x="12" y="42" fill="#0f172a" font-size="12" font-weight="700">MDX Karaoke 2</text>
    <text x="12" y="58" fill="#475569" font-size="10">Main vs Backup Vocals</text>
    <text x="12" y="72" fill="#2563eb" font-size="8" font-family="monospace">UVR_MDXNET_KARA_2</text>
  </g>

  <!-- Node 4: Stage 3 DeReverb (FoxJoy) -->
  <g transform="translate(545, 165)">
    <rect width="60" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="24" fill="#64748b" font-size="8" font-weight="700" text-anchor="middle">STAGE 3</text>
    <text x="30" y="39" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">DeReverb</text>
    <text x="30" y="51" fill="#64748b" font-size="7" text-anchor="middle">FoxJoy HQ</text>
  </g>

  <!-- Node 5: Stage 4 RVC Voice Conversion (Focal Node) -->
  <g transform="translate(625, 145)">
    <rect width="95" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="8" y="8" width="55" height="16" rx="3" fill="#fde68a"/>
    <text x="35" y="19" fill="#92400e" font-size="8" font-weight="700" text-anchor="middle">STAGE 4</text>
    <text x="47" y="44" fill="#b45309" font-size="13" font-weight="800" text-anchor="middle">RVC v2</text>
    <text x="47" y="60" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Voice Conversion</text>
    <text x="47" y="74" fill="#64748b" font-size="8" text-anchor="middle">RMVPE / Crepe</text>
    <rect x="8" y="80" width="79" height="14" rx="2" fill="#ffffff"/>
    <text x="47" y="90" fill="#d97706" font-size="7.5" font-family="monospace" text-anchor="middle">.pth + .index</text>
  </g>

  <!-- Node 6: Stage 5 Pedalboard Effects -->
  <g transform="translate(745, 160)">
    <rect width="75" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="37" y="22" fill="#64748b" font-size="8" font-weight="700" text-anchor="middle">STAGE 5</text>
    <text x="37" y="38" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">Effects</text>
    <text x="37" y="52" fill="#475569" font-size="8" text-anchor="middle">HPF + Reverb</text>
    <text x="37" y="62" fill="#475569" font-size="8" text-anchor="middle">Compressor</text>
  </g>

  <!-- Node 7: Stage 6 Audio Mixer (pydub) -->
  <g transform="translate(855, 155)">
    <rect width="85" height="80" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="42" y="24" fill="#4f46e5" font-size="9" font-weight="700" text-anchor="middle">STAGE 6</text>
    <text x="42" y="44" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Combine</text>
    <text x="42" y="60" fill="#475569" font-size="9" text-anchor="middle">Multi-track Mix</text>
    <text x="42" y="72" fill="#4338ca" font-size="8" font-family="monospace" text-anchor="middle">pydub overlay</text>
  </g>

  <!-- Node 8: Final Cover Output Card -->
  <g transform="translate(775, 290)">
    <rect width="165" height="100" rx="8" fill="url(#grad-output-light)" stroke="#4338ca" stroke-width="1.5"/>
    <text x="82" y="25" fill="#e0e7ff" font-size="10" font-weight="700" text-anchor="middle">FINAL COVER OUTPUT</text>
    <text x="82" y="48" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">&lt;Artist&gt; - &lt;Song&gt;</text>
    <text x="82" y="64" fill="#c7d2fe" font-size="10" text-anchor="middle">(&lt;Model&gt; Ver).mp3 / .wav</text>
    <rect x="20" y="74" width="125" height="18" rx="4" fill="rgba(0,0,0,0.2)"/>
    <text x="82" y="86" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle">Carbon Player / Download</text>
  </g>

</svg>
