<svg viewBox="0 0 980 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shutdown-diagram-title shutdown-diagram-desc" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <title id="shutdown-diagram-title">AICoverGen Process Lifecycle &amp; Reliable Shutdown Contract</title>
  <desc id="shutdown-diagram-desc">Windows Job Object kernel termination vs graceful Ctrl+C break lifecycle preventing orphan processes.</desc>

  <defs>
    <!-- Background Grid -->
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.75" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="grad-kernel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="grad-graceful" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="grad-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#ef4444"/>
    </marker>
    <marker id="arr-blue-life" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="340" rx="12" fill="#0b0f19"/>
  <rect width="980" height="340" rx="12" fill="url(#grid-dots)"/>
  <rect x="1" y="1" width="978" height="338" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(40, 20)">
    <text x="0" y="15" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.05em">DUAL-PATH RELIABLE SHUTDOWN CONTRACT</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11">Kernel-level Job Object guard and graceful process tree termination ensuring Port 7860 is always released</text>
  </g>

  <!-- Path 1 Guide (Graceful Ctrl+C) -->
  <text x="40" y="85" fill="#38bdf8" font-size="11" font-weight="700">PATH 1: GRACEFUL TERMINATION (Ctrl + C in Terminal)</text>
  
  <!-- Path 2 Guide (Kernel Window Close [X]) -->
  <text x="40" y="215" fill="#f87171" font-size="11" font-weight="700">PATH 2: HARD WINDOW CLOSE (Click [X] on Terminal Window)</text>

  <!-- ==================== PATH 1: CTRL + C ==================== -->
  <!-- 1. User presses Ctrl+C -->
  <g transform="translate(40, 100)">
    <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="65" y="24" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">USER ACTION</text>
    <text x="65" y="44" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Press Ctrl + C</text>
  </g>

  <path d="M170 132 H220" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arr-blue-life)"/>

  <!-- 2. Signal CTRL_BREAK_EVENT -->
  <g transform="translate(225, 100)">
    <rect width="170" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="85" y="24" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">SIGNAL DISPATCH</text>
    <text x="85" y="44" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">CTRL_BREAK_EVENT</text>
    <text x="85" y="56" fill="#64748b" font-size="8" text-anchor="middle">Sent to Process Group</text>
  </g>

  <path d="M395 132 H445" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arr-blue-life)"/>

  <!-- 3. Wait 3s or Taskkill -->
  <g transform="translate(450, 100)">
    <rect width="180" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="90" y="24" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">GRACEFUL WAIT</text>
    <text x="90" y="42" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Wait up to 3 seconds</text>
    <text x="90" y="55" fill="#f59e0b" font-size="8" text-anchor="middle">Fallback: taskkill /T /F</text>
  </g>

  <path d="M630 132 H735" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

  <!-- ==================== PATH 2: CLOSE WINDOW [X] ==================== -->
  <!-- 1. User clicks [X] -->
  <g transform="translate(40, 230)">
    <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="65" y="24" fill="#f87171" font-size="9" font-weight="700" text-anchor="middle">USER ACTION</text>
    <text x="65" y="44" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Click Window [X]</text>
  </g>

  <path d="M170 262 H220" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>

  <!-- 2. Windows Kernel Closes Job Handle -->
  <g transform="translate(225, 230)">
    <rect width="170" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="85" y="24" fill="#ef4444" font-size="9" font-weight="700" text-anchor="middle">OS KERNEL EVENT</text>
    <text x="85" y="44" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Close Job Handle</text>
    <text x="85" y="56" fill="#64748b" font-size="8" text-anchor="middle">Parent Process Dies</text>
  </g>

  <path d="M395 262 H445" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>

  <!-- 3. JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE -->
  <g transform="translate(450, 230)">
    <rect width="180" height="65" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="24" fill="#ef4444" font-size="9" font-weight="700" text-anchor="middle">WINDOWS JOB OBJECT</text>
    <text x="90" y="42" fill="#fca5a5" font-size="10" font-weight="800" text-anchor="middle">KILL_ON_JOB_CLOSE</text>
    <text x="90" y="55" fill="#94a3b8" font-size="8" text-anchor="middle">Terminates entire process tree</text>
  </g>

  <path d="M630 262 H735" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

  <!-- ==================== COMMON DESTINATION ==================== -->
  <g transform="translate(740, 130)">
    <rect width="200" height="135" rx="10" fill="url(#grad-success)" stroke="#34d399" stroke-width="1.8"/>
    <text x="100" y="32" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">CLEAN TERMINATION</text>
    <text x="100" y="55" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">✔ Port 7860 Released</text>
    <text x="100" y="75" fill="#d1fae5" font-size="10" text-anchor="middle">✔ Zero Orphan Processes</text>
    <text x="100" y="93" fill="#a7f3d0" font-size="9" text-anchor="middle">FFmpeg, SoX, frpc, Python killed</text>
    <rect x="20" y="103" width="160" height="20" rx="4" fill="rgba(0,0,0,0.2)"/>
    <text x="100" y="117" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">100% Ready for next run</text>
  </g>
</svg>
