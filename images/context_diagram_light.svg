<svg viewBox="0 0 980 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-title-l context-desc-l" style="background:#f8fafc; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <title id="context-title-l">AICoverGen System Context Diagram (Light Mode)</title>
  <desc id="context-desc-l">C4 Level 1 System Context Diagram showing users, external systems, and AICoverGen platform boundaries in light theme.</desc>

  <defs>
    <pattern id="grid-ctx-l" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="rgba(15, 23, 42, 0.08)"/>
    </pattern>
    <marker id="arr-ctx-l" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="980" height="440" rx="12" fill="#f8fafc"/>
  <rect width="980" height="440" rx="12" fill="url(#grid-ctx-l)"/>
  <rect x="1" y="1" width="978" height="438" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(40, 25)">
    <text x="0" y="15" fill="#0f172a" font-size="14" font-weight="700" letter-spacing="0.05em">SYSTEM CONTEXT DIAGRAM (C4 LEVEL 1)</text>
    <text x="0" y="32" fill="#64748b" font-size="11">System boundary, user personas, external dependencies, and network integrations</text>
  </g>

  <!-- Left: Users -->
  <g transform="translate(50, 100)">
    <rect width="180" height="120" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="16" fill="#e0f2fe"/>
    <text x="90" y="40" fill="#0284c7" font-size="12" font-weight="800" text-anchor="middle">👤</text>
    <text x="90" y="70" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Local User / Creator</text>
    <text x="90" y="88" fill="#64748b" font-size="9" text-anchor="middle">Browser on Localhost / LAN</text>
    <text x="90" y="102" fill="#0284c7" font-size="8" font-family="monospace" text-anchor="middle">http://127.0.0.1:7860</text>
  </g>

  <g transform="translate(50, 260)">
    <rect width="180" height="120" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="16" fill="#f3e8ff"/>
    <text x="90" y="40" fill="#9333ea" font-size="12" font-weight="800" text-anchor="middle">👥</text>
    <text x="90" y="70" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Remote Friend / Collaborator</text>
    <text x="90" y="88" fill="#64748b" font-size="9" text-anchor="middle">Mobile or External PC</text>
    <text x="90" y="102" fill="#9333ea" font-size="8" font-family="monospace" text-anchor="middle">https://*.gradio.live</text>
  </g>

  <!-- Center: System Boundary -->
  <rect x="290" y="80" width="380" height="320" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="305" y="68" width="170" height="22" rx="4" fill="#2563eb"/>
  <text x="390" y="83" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">SYSTEM BOUNDARY</text>

  <g transform="translate(320, 110)">
    <rect width="320" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="160" y="30" fill="#1d4ed8" font-size="14" font-weight="800" text-anchor="middle">AICoverGen (Local Edition)</text>
    <text x="160" y="48" fill="#64748b" font-size="10" text-anchor="middle">Neural Voice Conversion &amp; Source Separation</text>
    
    <rect x="20" y="65" width="280" height="45" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="160" y="85" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">Gradio WebUI &amp; Carbon Audio Controller</text>
    <text x="160" y="98" fill="#64748b" font-size="8" text-anchor="middle">Interactive Sliders, Player Card, Real-time Visualizer</text>

    <rect x="20" y="120" width="280" height="50" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="160" y="140" fill="#0284c7" font-size="10" font-weight="700" text-anchor="middle">Core Processing Engine</text>
    <text x="160" y="153" fill="#64748b" font-size="8" text-anchor="middle">SongMetadata Normalizer &amp; Windows Job Process Guard</text>

    <rect x="20" y="180" width="280" height="60" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="160" y="200" fill="#b45309" font-size="10" font-weight="700" text-anchor="middle">Neural Workloads (CUDA/PyTorch)</text>
    <text x="160" y="214" fill="#64748b" font-size="8" text-anchor="middle">MDX-Net ONNX Stems + RVC v2 Voice Transfer</text>
    <text x="160" y="226" fill="#059669" font-size="7.5" font-family="monospace" text-anchor="middle">FP16 Half-Precision (Optimized for 4GB VRAM)</text>
  </g>

  <!-- Right: External Systems -->
  <g transform="translate(730, 85)">
    <rect width="200" height="90" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="100" y="25" fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle">EXTERNAL MEDIA SOURCE</text>
    <text x="100" y="46" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">YouTube / YT Music</text>
    <text x="100" y="62" fill="#64748b" font-size="9" text-anchor="middle">Video Audio Stream &amp; Metadata</text>
    <text x="100" y="74" fill="#dc2626" font-size="8" font-family="monospace" text-anchor="middle">yt-dlp extraction</text>
  </g>

  <g transform="translate(730, 195)">
    <rect width="200" height="90" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <text x="100" y="25" fill="#d97706" font-size="10" font-weight="700" text-anchor="middle">MODEL REPOSITORY</text>
    <text x="100" y="46" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Hugging Face Hub</text>
    <text x="100" y="62" fill="#64748b" font-size="9" text-anchor="middle">RVC Checkpoint (.pth / .index)</text>
    <text x="100" y="74" fill="#b45309" font-size="8" font-family="monospace" text-anchor="middle">HTTP GET (with HF Token auth)</text>
  </g>

  <g transform="translate(730, 305)">
    <rect width="200" height="85" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="100" y="22" fill="#7c3aed" font-size="10" font-weight="700" text-anchor="middle">TUNNELING SERVICE</text>
    <text x="100" y="42" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Gradio Public Tunnel</text>
    <text x="100" y="58" fill="#64748b" font-size="9" text-anchor="middle">Ephemeral reverse proxy tunnel</text>
    <text x="100" y="70" fill="#6d28d9" font-size="8" font-family="monospace" text-anchor="middle">frpc proxy daemon</text>
  </g>

  <!-- Connectors -->
  <path d="M230 160 H320" stroke="#0284c7" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx-l)"/>
  <path d="M230 320 Q270 320 270 345 H320" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx-l)"/>

  <path d="M640 160 H730" stroke="#dc2626" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx-l)"/>
  <path d="M640 240 H730" stroke="#d97706" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx-l)"/>
  <path d="M640 330 H730" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#arr-ctx-l)"/>
</svg>
